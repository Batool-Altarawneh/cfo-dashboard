# docker-compose.yml
# Instead of installing PostgreSQL directly on my Windows machine,I am running it inside a Docker container to keep the environment clean and reproducible.
#
# To start the database:
# docker compose up -d
#
# To stop the database:
# docker compose down

version: "3.8"

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL Database Service
  # ---------------------------------------------------------------------------
  # This service creates a PostgreSQL database container.
  # The database will be used to store:
  # 1. Raw financial data in a staging schema
  # 2. Clean star schema tables in a production schema
  # ---------------------------------------------------------------------------

  postgres:
    # I am using a fixed PostgreSQL version instead of "latest".
    # This avoids unexpected issues if PostgreSQL releases a newer version later.
    image: postgres:15

    # This gives the container a readable name.
    # It makes it easier to recognize in Docker Desktop and in terminal commands.
    container_name: cfo_postgres

    # This tells Docker to restart the container automatically
    # unless I manually stop it.
    # Useful if Docker Desktop restarts or the computer restarts.
    restart: unless-stopped

    # Environment variables used by the official PostgreSQL Docker image.
    # These values are used when the database is created for the first time.
    environment:
      POSTGRES_DB: cfo_dashboard          # Name of the database for this project
      POSTGRES_USER: postgres             # Main PostgreSQL username
      POSTGRES_PASSWORD: password123  # Password used to connect from Python/Power BI

    # Port mapping between my laptop and the container.
    # Left side  = my local machine port
    # Right side = PostgreSQL port inside the container
    #
    # This means I can connect to PostgreSQL from Python, DBeaver, pgAdmin, or Power BI using:
    # host: localhost
    # port: 5432
    ports:
      - "5432:5432"

    # Volumes are used to persist data and run initialization scripts.
    volumes:
      # This named volume stores PostgreSQL data outside the container.
      # Without this, data could be lost when the container is removed.
      - postgres_data:/var/lib/postgresql/data

      # This mounts my local init.sql file into the special PostgreSQL init folder.
      # PostgreSQL automatically runs scripts in this folder only the first time
      # the database is created.
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

    # Healthcheck tells Docker how to check if PostgreSQL is ready.
    # A container can be "started" but the database may still not be ready to accept connections.
    #
    # pg_isready is a PostgreSQL command that checks database readiness.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s   # Check every 10 seconds
      timeout: 5s     # Wait up to 5 seconds for each check
      retries: 5      # Try 5 times before marking the container as unhealthy


# ---------------------------------------------------------------------------
# Named Volumes
# ---------------------------------------------------------------------------
# A named volume is managed by Docker and keeps the database data persistent.
# This means the data survives container restarts.
# ---------------------------------------------------------------------------

volumes:
  postgres_data: